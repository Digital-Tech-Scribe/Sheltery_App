<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      name="description"
      content="The Sheltery is a Lagos-based luxury real estate brand empowering dreams with trusted property advisory, curated listings, and investment guidance."
    />
    <title>The Sheltery</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background:
          radial-gradient(circle at 50% 18%, rgba(220, 203, 179, 0.04), transparent 22%),
          linear-gradient(180deg, #10211c 0%, #08120f 100%);
      }

      body {
        overflow-x: hidden;
      }

      #boot-entrance {
        position: fixed;
        inset: 0;
        z-index: 100000;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 18%, rgba(220, 203, 179, 0.04), transparent 22%),
          linear-gradient(180deg, #10211c 0%, #08120f 100%);
        opacity: 1;
        visibility: visible;
        transition: opacity 180ms ease, visibility 180ms ease;
      }

      #boot-entrance::before,
      #boot-entrance::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      #boot-entrance::before {
        background:
          linear-gradient(
            180deg,
            transparent 0%,
            transparent 23.5%,
            rgba(242, 241, 237, 0.03) 23.7%,
            transparent 24%,
            transparent 47.5%,
            rgba(242, 241, 237, 0.03) 47.7%,
            transparent 48%,
            transparent 71.5%,
            rgba(242, 241, 237, 0.03) 71.7%,
            transparent 72%
          );
        opacity: 0.5;
      }

      #boot-entrance::after {
        background:
          radial-gradient(circle at center, transparent 45%, rgba(0, 0, 0, 0.2) 100%),
          linear-gradient(180deg, rgba(0, 0, 0, 0.04), transparent 18%, transparent 82%, rgba(0, 0, 0, 0.18));
      }

      body.app-hydrated #boot-entrance {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .boot-entrance__scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      .boot-entrance__meta {
        position: absolute;
        left: 50%;
        bottom: clamp(3.4rem, 9.5vh, 5rem);
        z-index: 1;
        display: grid;
        justify-items: center;
        gap: 0.95rem;
        width: min(21rem, calc(100vw - 3rem));
        transform: translateX(-50%);
        text-align: center;
      }

      .boot-entrance__caption {
        margin: 0;
        color: rgba(242, 241, 237, 0.84);
        font: 400 0.62rem/1.7 "Suisse Intl", "Helvetica Neue", Arial, sans-serif;
        letter-spacing: 0.28rem;
        text-transform: uppercase;
      }

      .boot-entrance__glyph {
        position: relative;
        display: inline-flex;
        align-items: center;
        width: 4.8rem;
        height: 0.95rem;
      }

      .boot-entrance__glyph-ring,
      .boot-entrance__glyph-stem,
      .boot-entrance__glyph-tooth {
        position: absolute;
        display: block;
      }

      .boot-entrance__glyph-ring {
        top: 50%;
        left: 0.3rem;
        width: 0.46rem;
        height: 0.46rem;
        border: 1px solid rgba(220, 203, 179, 0.78);
        transform: translateY(-50%) rotate(45deg);
      }

      .boot-entrance__glyph-stem {
        top: 50%;
        left: 0.94rem;
        width: 2.3rem;
        height: 1px;
        background: rgba(220, 203, 179, 0.72);
        transform: translateY(-50%);
      }

      .boot-entrance__glyph-tooth {
        top: calc(50% + 0.06rem);
        left: 3.08rem;
        width: 1.06rem;
        height: 0.52rem;
        border: 1px solid rgba(220, 203, 179, 0.72);
        border-top: 0;
        border-left: 0;
      }

      @media (max-width: 720px) {
        .boot-entrance__caption {
          font-size: 0.55rem;
          letter-spacing: 0.18rem;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-entrance" aria-hidden="true">
      <svg
        class="boot-entrance__scene"
        viewBox="0 0 1000 1000"
        preserveAspectRatio="none"
      >
        <defs>
          <clipPath id="boot-keyhole" clipPathUnits="userSpaceOnUse">
            <path d="M 500 376 A 48 48 0 1 1 499.99 376 Z M 476 453 L 524 453 L 540 662 L 460 662 Z" />
          </clipPath>
          <linearGradient id="boot-shade" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="rgba(5, 11, 9, 0.04)" />
            <stop offset="68%" stop-color="rgba(5, 11, 9, 0.16)" />
            <stop offset="100%" stop-color="rgba(5, 11, 9, 0.32)" />
          </linearGradient>
        </defs>
        <g clip-path="url(#boot-keyhole)">
          <image
            href="./assets/hero-lagos.jpg"
            x="0"
            y="0"
            width="1000"
            height="1000"
            preserveAspectRatio="xMidYMid slice"
          />
          <rect x="0" y="0" width="1000" height="1000" fill="url(#boot-shade)" />
        </g>
      </svg>
      <div class="boot-entrance__meta">
        <p class="boot-entrance__caption">Unlock the next chapter of Lagos living.</p>
        <span class="boot-entrance__glyph">
          <span class="boot-entrance__glyph-ring"></span>
          <span class="boot-entrance__glyph-stem"></span>
          <span class="boot-entrance__glyph-tooth"></span>
        </span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
